[project]
name = "web-browser-mcp"
version = "1.2.0"
description = "MCP server that drives a real Chrome browser with Playwright — web research, page reading and interaction, and LinkedIn profile editing with human approval"
requires-python = ">=3.10"
authors = [
    { name = "Pawan Gunjkar", email = "pawangunjkar@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "playwright", "browser", "chrome", "web-research", "linkedin", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "mcp[cli]>=1.10.0,<2",
    "playwright>=1.45",
]

[project.scripts]
web-browser-mcp = "web_browser_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Pawangunjkar/web-browser-mcp"
Repository = "https://github.com/Pawangunjkar/web-browser-mcp"
Issues = "https://github.com/Pawangunjkar/web-browser-mcp/issues"
Documentation = "https://github.com/Pawangunjkar/web-browser-mcp#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_browser_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests/*.py",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "PUBLISHING.md",
]
